name: satisfied_vegetarian
volumes:
  postgres_data:
  static_value:
  media_value:
  frontend_static:

services:
  db:
    image: postgres:18.7
    container_name: satisfied_vegetarian-db
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  backend:
    image: sibnum/satisfied_vegetarian-backend:latest
    container_name: satisfied_vegetarian-backend
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: always

  frontend:
    image: sibnum/satisfied_vegetarian-frontend:latest
    container_name: satisfied_vegetarian-frontend
    volumes:
      - frontend_static:/app/build
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  gateway:
    image: sibnum/satisfied_vegetarian-gateway:latest
    container_name: satisfied_vegetarian-gateway
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docs/:/usr/share/nginx/html/api/docs/
      - static_value:/var/html/static/
      - media_value:/var/html/media/
      - frontend_static:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: always
